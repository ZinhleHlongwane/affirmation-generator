name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test
        env:
          AI_ENABLED: "false"
          KAFKA_ENABLED: "false"
          OPENAI_API_KEY: ""
          DATABASE_URL: "sqlite:///./test_ci.db"
        run: pytest -q
